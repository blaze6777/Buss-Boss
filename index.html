<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bus Boss - Diagnostics</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;padding:20px}
    .pill{display:inline-block;padding:6px 10px;border:1px solid #ccc;border-radius:999px;margin-right:8px}
    button{padding:10px 12px}
  </style>
</head>
<body>
  <div class="pill">🧩 Build: <span id="build">diag-1</span></div>
  <div class="pill">🟢 JS: <span id="jsStatus">...</span></div>
  <p>If JS runs, the JS pill will change and the button will work.</p>
  <button id="testBtn">Click me</button>
  <pre id="log"></pre>

  <script>
    (function(){
      const logEl = document.getElementById('log');
      function log(msg){ logEl.textContent += msg + "\n"; }
      const js = document.getElementById('jsStatus');
      js.textContent = 'SCRIPT-RAN';
      log('Script executed at: ' + new Date().toISOString());

      document.getElementById('testBtn').addEventListener('click', () => {
        alert('Button works. JS is executing.');
        log('Button clicked at: ' + new Date().toISOString());
      });

      window.addEventListener('load', () => {
        js.textContent = 'LOAD-EVENT';
        log('Window load fired.');
      });
    })();
  </script>
</body>
</html>
